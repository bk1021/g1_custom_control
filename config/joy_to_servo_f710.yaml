joy_to_servo_mapper:
  ros__parameters:
    joy_topic: /joy
    publish_rate_hz: 100.0
    deadzone: 0.10

    # Set to -1 to disable deadman gating.
    deadman_button_index: -1
    mode_cycle_button_index: 3

    # F710 X-mode typical axis layout on Linux joy_node.
    axis_left_x: 0
    axis_left_y: 1
    axis_right_x: 3
    axis_right_y: 4
    axis_dpad_x: 6
    axis_dpad_y: 7

    # Set per your button mapping. -1 disables that direction.
    button_left_up: 4
    button_left_down: -1
    button_right_up: 5
    button_right_down: -1

    translation_speed: 0.20
    z_speed: 0.20
    rotation_speed: 0.80
    joint_speed: 0.60

    left_twist_topic: /left_servo/delta_twist_cmds
    right_twist_topic: /right_servo/delta_twist_cmds
    left_joint_topic: /left_servo/delta_joint_cmds
    right_joint_topic: /right_servo/delta_joint_cmds

    left_command_frame: left_wrist_yaw_link
    right_command_frame: right_wrist_yaw_link
    planning_frame: pelvis

    left_joint_names:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint

    right_joint_names:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
